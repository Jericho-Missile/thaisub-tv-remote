# Every push and pull request: the native libraries (chiaki-ng), the unit tests and a debug APK.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  # (this edition: also by hand, from the Actions tab)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: The shared core's commit
        id: core
        run: echo "ref=$(grep -v '^#' native/core.ref | grep -v '^$' | tail -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          repository: vi-translator/vi-translator-desktop
          ref: ${{ steps.core.outputs.ref }}
          path: core-src

      - name: Rust for the shared core
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
          echo "VIT_CORE_DIR=$GITHUB_WORKSPACE/core-src" >> "$GITHUB_ENV"
          echo "core_sha=$(git -C core-src rev-parse HEAD)" >> "$GITHUB_ENV"

      # (this edition: its changes to the shared core, kept as patches on the commit in native/core.ref;
      # the Thai swear switch is native/core-patches/0001-thai-swear-switch.patch)
      - name: This edition's changes to the core
        run: |
          for p in native/core-patches/*.patch; do
            echo "== $p"
            git -C core-src apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - name: The core's Thai tests (the swear switch)
        working-directory: core-src
        run: cargo test -p vi-translator-core --lib thai::tests

      - name: Tools for chiaki-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build protobuf-compiler python3-protobuf
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: The chiaki-ng commit
        id: chiaki
        run: echo "sha=$(git -C third-party/chiaki-ng rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Native libraries (cached by their sources)
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native/out
          key: native-${{ steps.chiaki.outputs.sha }}-${{ env.core_sha }}-${{ hashFiles('native/CMakeLists.txt', 'native/build.sh', 'native/jni/**', 'native/cmake/**', 'native/core-patches/**') }}

      - name: Build the native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: native/build.sh

      - name: The core's Kotlin bindings in the repository match its library
        run: |
          git diff --exit-code -- app/src/main/kotlin/app/vitranslator/core/ || {
            echo "::error::app/src/main/kotlin/app/vitranslator/core/vi_translator_ffi.kt differs from the core's at native/core.ref: commit the copied file"; exit 1; }

      - name: Tests and the debug APK
        # (this edition is built from the play flavour only: no self-update)
        run: ./gradlew --no-daemon testPlayDebugUnitTest assemblePlayDebug -PrequireNative

      - uses: actions/upload-artifact@v4
        with:
          name: thaisub-tv-remote-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
          if-no-files-found: error
